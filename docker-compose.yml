version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: medistock_mysql
    restart: always
    environment:
      MYSQL_DATABASE: medistock_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: medistock_user
      MYSQL_PASSWORD: medistock_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  web:
    build: .
    container_name: medistock_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python seed_data.py &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - USE_MYSQL=True
      - DB_NAME=medistock_db
      - DB_USER=medistock_user
      - DB_PASSWORD=medistock_pass
      - DB_HOST=db
      - DB_PORT=3306
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: medistock_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - web

volumes:
  mysql_data: