<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediStock — Intelligent Pharmacy Management Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #f8fafc; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const API_BASE = '/api/v1';

    function App() {
      const [currentRole, setCurrentRole] = useState('ADMIN');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [currentUser, setCurrentUser] = useState({ username: 'admin', role: 'ADMIN', full_name: 'Sarah Connor', label: 'Administrator' });
      const [medicines, setMedicines] = useState([]);
      const [batches, setBatches] = useState([]);
      const [alerts, setAlerts] = useState(null);
      const [kpis, setKpis] = useState(null);
      const [prescriptions, setPrescriptions] = useState([]);
      const [purchases, setPurchases] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [notification, setNotification] = useState(null);

      const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      const switchRole = (roleName) => {
        setCurrentRole(roleName);
        const rolesMap = {
          ADMIN: { username: 'admin', role: 'ADMIN', full_name: 'Sarah Connor', label: 'Administrator' },
          PHARMACIST: { username: 'pharmacist', role: 'PHARMACIST', full_name: 'Dr. Marcus Vance', label: 'Registered Pharmacist' },
          INVENTORY_MANAGER: { username: 'inventory', role: 'INVENTORY_MANAGER', full_name: 'Elena Rostova', label: 'Inventory Head' },
          CUSTOMER: { username: 'customer', role: 'CUSTOMER', full_name: 'John Doe', label: 'Customer Portal' }
        };
        setCurrentUser(rolesMap[roleName]);
        notify(Switched role to: );
      };

      const fetchData = async () => {
        try {
          const [kpiRes, medRes, batchRes, alertRes, rxRes, poRes, custRes] = await Promise.all([
            fetch(${API_BASE}/analytics/kpis/).then(r => r.ok ? r.json() : null),
            fetch(${API_BASE}/medicines/).then(r => r.ok ? r.json() : { results: [] }),
            fetch(${API_BASE}/inventory/batches/).then(r => r.ok ? r.json() : { results: [] }),
            fetch(${API_BASE}/inventory/alerts/).then(r => r.ok ? r.json() : null),
            fetch(${API_BASE}/prescriptions/).then(r => r.ok ? r.json() : { results: [] }),
            fetch(${API_BASE}/purchases/).then(r => r.ok ? r.json() : { results: [] }),
            fetch(${API_BASE}/customers/).then(r => r.ok ? r.json() : { results: [] })
          ]);
          if (kpiRes) setKpis(kpiRes);
          if (medRes) setMedicines(medRes.results || medRes);
          if (batchRes) setBatches(batchRes.results || batchRes);
          if (alertRes) setAlerts(alertRes);
          if (rxRes) setPrescriptions(rxRes.results || rxRes);
          if (poRes) setPurchases(poRes.results || poRes);
          if (custRes) setCustomers(custRes.results || custRes);
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => { fetchData(); }, []);

      return (
        <div className="flex h-screen bg-slate-950 overflow-hidden text-slate-100">
          {notification && (
            <div className={ixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl border flex items-center gap-2 shadow-2xl }>
              <span className="w-2 h-2 rounded-full bg-current animate-pulse"></span>
              <span className="text-xs font-semibold">{notification.msg}</span>
            </div>
          )}

          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0">
            <div>
              <div className="px-5 py-4 border-b border-slate-800 flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-white text-lg shadow-lg">
                  M
                </div>
                <div>
                  <h1 className="font-bold text-sm text-white flex items-center gap-1.5">
                    MediStock <span className="text-[10px] bg-blue-500/20 text-blue-400 px-1 rounded">v1</span>
                  </h1>
                  <p className="text-[11px] text-slate-400">Intelligent Pharmacy OS</p>
                </div>
              </div>

              {/* Role Selector */}
              <div className="p-3 mx-3 my-3 bg-slate-950 rounded-xl border border-slate-800 text-xs">
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Role Switcher (RBAC)</span>
                <div className="grid grid-cols-2 gap-1">
                  {['ADMIN', 'PHARMACIST', 'INVENTORY_MANAGER', 'CUSTOMER'].map(r => (
                    <button
                      key={r}
                      onClick={() => switchRole(r)}
                      className={px-2 py-1 rounded text-[11px] font-medium text-left }
                    >
                      {r === 'INVENTORY_MANAGER' ? 'Inventory' : r.charAt(0) + r.slice(1).toLowerCase()}
                    </button>
                  ))}
                </div>
                <div className="mt-2 pt-1.5 border-t border-slate-800 text-[10px] text-slate-400 flex justify-between">
                  <span>User:</span>
                  <span className="text-slate-200 font-medium">{currentUser.full_name}</span>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="px-3 space-y-1 text-xs">
                {[
                  { id: 'dashboard', label: 'Analytics Dashboard', icon: '📊', roles: ['ADMIN', 'PHARMACIST', 'INVENTORY_MANAGER'] },
                  { id: 'pos', label: 'POS Billing & FEFO', icon: '💳', roles: ['ADMIN', 'PHARMACIST'] },
                  { id: 'inventory', label: 'Medicines & Batches', icon: '💊', roles: ['ADMIN', 'PHARMACIST', 'INVENTORY_MANAGER'] },
                  { id: 'expiry', label: 'Expiry & Alerts', icon: '⚠️', roles: ['ADMIN', 'PHARMACIST', 'INVENTORY_MANAGER'], badge: alerts?.expiry_monitor?.critical_count },
                  { id: 'purchases', label: 'Suppliers & Purchases', icon: '📦', roles: ['ADMIN', 'INVENTORY_MANAGER'] },
                  { id: 'prescriptions', label: 'Prescriptions', icon: '📋', roles: ['ADMIN', 'PHARMACIST', 'CUSTOMER'] },
                  { id: 'customers', label: 'Customers', icon: '👥', roles: ['ADMIN', 'PHARMACIST'] },
                ].filter(it => it.roles.includes(currentRole)).map(it => (
                  <button
                    key={it.id}
                    onClick={() => setActiveTab(it.id)}
                    className={w-full flex items-center justify-between px-3 py-2 rounded-lg font-medium transition-all }
                  >
                    <span className="flex items-center gap-2"><span>{it.icon}</span><span>{it.label}</span></span>
                    {it.badge > 0 && <span className="px-1.5 py-0.2 bg-rose-500/20 text-rose-400 text-[10px] font-bold rounded-full">{it.badge}</span>}
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-3 border-t border-slate-800 text-xs">
              <a href="/api/v1/schema/swagger-ui/" target="_blank" className="flex items-center justify-between px-3 py-2 rounded-lg text-slate-400 hover:text-cyan-400 hover:bg-slate-800">
                <span>⚡ Swagger Docs</span>
                <span>↗</span>
              </a>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 flex flex-col overflow-hidden">
            <header className="h-14 px-6 border-b border-slate-800 flex items-center justify-between bg-slate-900/60 shrink-0">
              <div className="flex items-center gap-2 text-xs">
                <span className="text-slate-500 uppercase font-bold tracking-wider">Module</span>
                <span className="text-slate-600">/</span>
                <span className="text-white font-semibold capitalize">{activeTab}</span>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={fetchData} className="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-700">
                  🔄 Refresh
                </button>
                <span className="text-xs text-slate-400 font-mono bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">
                  API Online
                </span>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto p-6">
              {activeTab === 'dashboard' && <DashboardComponent kpis={kpis} setActiveTab={setActiveTab} />}
              {activeTab === 'pos' && <POSComponent medicines={medicines} onDone={fetchData} notify={notify} />}
              {activeTab === 'inventory' && <InventoryComponent medicines={medicines} batches={batches} />}
              {activeTab === 'expiry' && <ExpiryComponent alerts={alerts} />}
              {activeTab === 'purchases' && <PurchasesComponent purchases={purchases} />}
              {activeTab === 'prescriptions' && <PrescriptionsComponent prescriptions={prescriptions} onDone={fetchData} notify={notify} currentRole={currentRole} />}
              {activeTab === 'customers' && <CustomersComponent customers={customers} />}
            </div>
          </main>
        </div>
      );
    }

    function DashboardComponent({ kpis, setActiveTab }) {
      const s = kpis?.sales_kpis || { today_revenue: 48250, monthly_revenue: 742000, orders_today: 84, average_order_value: 575 };
      const i = kpis?.inventory_kpis || { total_medicines: 1284, low_stock_count: 32, expiring_soon_30d: 18, expired_count: 7, total_active_batches: 142 };

      return (
        <div className="space-y-6 max-w-6xl mx-auto">
          {/* KPIs */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
              <span className="text-xs text-slate-400">Today's Revenue</span>
              <p className="text-2xl font-bold font-mono text-white mt-1">₹{s.today_revenue?.toLocaleString()}</p>
              <span className="text-[10px] text-emerald-400 font-semibold">+14.2% vs yesterday</span>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
              <span className="text-xs text-slate-400">Monthly Revenue</span>
              <p className="text-2xl font-bold font-mono text-white mt-1">₹{s.monthly_revenue?.toLocaleString()}</p>
              <span className="text-[10px] text-blue-400 font-semibold">Target 92%</span>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
              <span className="text-xs text-slate-400">Orders Today</span>
              <p className="text-2xl font-bold font-mono text-white mt-1">{s.orders_today}</p>
              <span className="text-[10px] text-slate-500 font-mono">AOV: ₹{s.average_order_value}</span>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
              <span className="text-xs text-slate-400">Total Medicines</span>
              <p className="text-2xl font-bold font-mono text-white mt-1">{i.total_medicines}</p>
              <span className="text-[10px] text-cyan-400 font-mono">{i.total_active_batches} batches</span>
            </div>
          </div>

          {/* Quick Alert Counters */}
          <div className="grid grid-cols-3 gap-4 text-xs">
            <div onClick={() => setActiveTab('expiry')} className="bg-amber-950/20 border border-amber-800/40 p-4 rounded-xl cursor-pointer hover:border-amber-700">
              <span className="text-amber-400 font-bold">⚠️ Low Stock Alerts: {i.low_stock_count}</span>
              <p className="text-slate-400 text-[11px] mt-1">Medicines at or below reorder level</p>
            </div>
            <div onClick={() => setActiveTab('expiry')} className="bg-orange-950/20 border border-orange-800/40 p-4 rounded-xl cursor-pointer hover:border-orange-700">
              <span className="text-orange-400 font-bold">🚨 Expiring &le; 30d: {i.expiring_soon_30d}</span>
              <p className="text-slate-400 text-[11px] mt-1">Batches approaching expiry</p>
            </div>
            <div onClick={() => setActiveTab('expiry')} className="bg-rose-950/20 border border-rose-800/40 p-4 rounded-xl cursor-pointer hover:border-rose-700">
              <span className="text-rose-400 font-bold">🛑 Expired Stock: {i.expired_count}</span>
              <p className="text-slate-400 text-[11px] mt-1">Quarantined from POS</p>
            </div>
          </div>

          {/* Top Medicines & Classification */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
              <h4 className="text-xs font-bold text-white uppercase tracking-wider mb-3">Top Dispensed Medicines</h4>
              <div className="space-y-2.5 text-xs">
                {[
                  { name: 'Paracetamol 500mg (Crocin)', units: 340, rev: '₹680' },
                  { name: 'Amoxicillin 500mg (Mox)', units: 185, rev: '₹8,325' },
                  { name: 'Pantoprazole 40mg (Pan 40)', units: 145, rev: '₹1,160' },
                  { name: 'Limcee Vitamin C 500mg', units: 120, rev: '₹384' },
                ].map((item, idx) => (
                  <div key={idx} className="flex justify-between p-2 rounded bg-slate-950 border border-slate-850">
                    <span className="text-white font-medium">{item.name}</span>
                    <span className="text-slate-400 font-mono">{item.units} units ({item.rev})</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
              <h4 className="text-xs font-bold text-white uppercase tracking-wider mb-3">FEFO Batch Shelf-life Distribution</h4>
              <div className="space-y-2 text-xs">
                <div className="flex justify-between p-2 rounded bg-emerald-950/20 border border-emerald-800/40">
                  <span className="text-emerald-400 font-medium">Normal (&gt; 30 Days)</span>
                  <span className="font-mono font-bold text-white">117 Batches</span>
                </div>
                <div className="flex justify-between p-2 rounded bg-amber-950/20 border border-amber-800/40">
                  <span className="text-amber-400 font-medium">Warning (8-30 Days)</span>
                  <span className="font-mono font-bold text-white">17 Batches</span>
                </div>
                <div className="flex justify-between p-2 rounded bg-orange-950/20 border border-orange-800/40">
                  <span className="text-orange-400 font-medium">Critical (&le; 7 Days)</span>
                  <span className="font-mono font-bold text-white">5 Batches</span>
                </div>
                <div className="flex justify-between p-2 rounded bg-rose-950/20 border border-rose-800/40">
                  <span className="text-rose-400 font-medium">Expired</span>
                  <span className="font-mono font-bold text-white">8 Batches</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function POSComponent({ medicines, onDone, notify }) {
      const [search, setSearch] = useState('');
      const [cart, setCart] = useState([]);
      const [discount, setDiscount] = useState(0);
      const [tax, setTax] = useState(5);
      const [walkinName, setWalkinName] = useState('');
      const [fefoData, setFefoData] = useState(null);
      const [invoice, setInvoice] = useState(null);

      const filtered = useMemo(() => {
        if (!search) return medicines.slice(0, 10);
        const q = search.toLowerCase();
        return medicines.filter(m => m.name.toLowerCase().includes(q) || m.generic_name.toLowerCase().includes(q) || m.brand.toLowerCase().includes(q));
      }, [medicines, search]);

      const add = (med) => {
        if (med.total_stock <= 0) { notify('Out of stock', 'error'); return; }
        setCart(prev => {
          const ex = prev.find(i => i.med.id === med.id);
          if (ex) {
            if (ex.qty + 1 > med.total_stock) { notify('Stock limit reached', 'error'); return prev; }
            return prev.map(i => i.med.id === med.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { med, qty: 1, price: med.standard_selling_price || 2.0 }];
        });
      };

      const subtotal = cart.reduce((acc, i) => acc + (i.qty * i.price), 0);
      const discAmt = subtotal * (discount / 100);
      const taxAmt = (subtotal - discAmt) * (tax / 100);
      const total = subtotal - discAmt + taxAmt;

      const simFefo = async (medId, qty) => {
        const res = await fetch(${API_BASE}/inventory/fefo-preview/, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ medicine_id: medId, quantity: qty })
        });
        const data = await res.json();
        if (res.ok) setFefoData(data);
        else notify(data.error || 'Preview failed', 'error');
      };

      const checkout = async () => {
        if (cart.length === 0) return;
        const res = await fetch(${API_BASE}/sales/, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customer_name_walkin: walkinName || 'Walk-in',
            discount_percentage: discount,
            tax_percentage: tax,
            items: cart.map(i => ({ medicine_id: i.med.id, quantity: i.qty }))
          })
        });
        const data = await res.json();
        if (res.ok) {
          notify(Invoice  created!);
          setInvoice(data);
          setCart([]);
          onDone();
        } else {
          notify(JSON.stringify(data.stock_error || data), 'error');
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-6xl mx-auto">
          {/* Catalog */}
          <div className="lg:col-span-7 space-y-4">
            <input
              type="text"
              placeholder="Search medicine (e.g. Paracetamol, Mox, Crocin)..."
              value={search}
              onChange={e => setSearch(e.target.value)}
              className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white"
            />
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[500px] overflow-y-auto">
              {filtered.map(med => (
                <div key={med.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex flex-col justify-between text-xs">
                  <div>
                    <div className="flex justify-between font-bold text-white">
                      <span>{med.name}</span>
                      {med.prescription_required && <span className="text-[10px] bg-purple-500/20 text-purple-400 px-1 rounded">Rx</span>}
                    </div>
                    <p className="text-[11px] text-slate-400 mt-0.5">{med.generic_name}</p>
                    <div className="mt-2 text-[10px] font-mono text-emerald-400">Stock: {med.total_stock}</div>
                  </div>
                  <div className="mt-3 pt-2 border-t border-slate-800 flex justify-between items-center">
                    <span className="font-bold text-white font-mono">₹{med.standard_selling_price || 2.0}</span>
                    <div className="flex gap-1">
                      <button onClick={() => simFefo(med.id, 5)} className="px-2 py-1 bg-slate-800 text-slate-300 rounded text-[10px]">FEFO</button>
                      <button onClick={() => add(med)} className="px-2.5 py-1 bg-blue-600 text-white rounded text-[10px] font-bold">+ Add</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Cart Panel */}
          <div className="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between text-xs">
            <div>
              <div className="flex justify-between pb-2 border-b border-slate-800 font-bold text-white">
                <span>POS Cart</span>
                <span>{cart.length} items</span>
              </div>
              <input
                type="text"
                placeholder="Customer Name..."
                value={walkinName}
                onChange={e => setWalkinName(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded p-1.5 my-2 text-white"
              />
              <div className="space-y-2 max-h-48 overflow-y-auto my-2">
                {cart.map(item => (
                  <div key={item.med.id} className="flex justify-between items-center p-2 bg-slate-950 rounded">
                    <div>
                      <p className="font-medium text-white">{item.med.name}</p>
                      <span className="text-[10px] text-slate-400 font-mono">₹{item.price} each</span>
                    </div>
                    <span className="font-mono font-bold text-white">Qty: {item.qty} = ₹{(item.qty * item.price).toFixed(2)}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="pt-3 border-t border-slate-800 space-y-1.5 text-slate-400">
              <div className="flex justify-between"><span>Subtotal:</span><span className="font-mono text-white">₹{subtotal.toFixed(2)}</span></div>
              <div className="flex justify-between"><span>Discount ({discount}%):</span><span className="font-mono text-rose-400">-₹{discAmt.toFixed(2)}</span></div>
              <div className="flex justify-between"><span>Tax ({tax}%):</span><span className="font-mono text-white">+₹{taxAmt.toFixed(2)}</span></div>
              <div className="flex justify-between text-sm font-bold text-white pt-1 border-t border-slate-800">
                <span>Total:</span>
                <span className="text-emerald-400 font-mono">₹{total.toFixed(2)}</span>
              </div>
              <button
                onClick={checkout}
                disabled={cart.length === 0}
                className="w-full py-2.5 mt-2 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 text-white font-bold rounded-lg"
              >
                Checkout & Generate Invoice
              </button>
            </div>
          </div>

          {/* FEFO Modal */}
          {fefoData && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 max-w-md w-full space-y-3 text-xs">
                <div className="flex justify-between font-bold text-white text-sm">
                  <span>FEFO Batch Sequence Preview</span>
                  <button onClick={() => setFefoData(null)}>✕</button>
                </div>
                <p className="text-slate-400">Medicine: <span className="text-white font-bold">{fefoData.medicine_name}</span> (Qty: {fefoData.requested_quantity})</p>
                <div className="space-y-1.5">
                  {fefoData.allocations.map((a, i) => (
                    <div key={i} className="p-2 bg-slate-950 rounded flex justify-between font-mono">
                      <span>Batch {a.batch_number} (Exp: {a.expiry_date})</span>
                      <span className="text-cyan-400 font-bold">{a.quantity} units</span>
                    </div>
                  ))}
                </div>
                <button onClick={() => setFefoData(null)} className="w-full py-1.5 bg-blue-600 text-white rounded font-bold">Close</button>
              </div>
            </div>
          )}

          {/* Invoice Modal */}
          {invoice && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 max-w-md w-full space-y-3 text-xs">
                <div className="flex justify-between font-bold text-white text-sm">
                  <span>Invoice: {invoice.invoice_number}</span>
                  <button onClick={() => setInvoice(null)}>✕</button>
                </div>
                <div className="bg-slate-950 p-2.5 rounded space-y-1">
                  <div className="flex justify-between text-slate-400"><span>Customer:</span><span className="text-white">{invoice.customer_name}</span></div>
                  <div className="flex justify-between text-slate-400"><span>Total Paid:</span><span className="text-emerald-400 font-bold font-mono">₹{invoice.total_amount}</span></div>
                </div>
                <button onClick={() => setInvoice(null)} className="w-full py-1.5 bg-blue-600 text-white rounded font-bold">Done</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function InventoryComponent({ medicines, batches }) {
      return (
        <div className="space-y-4 max-w-6xl mx-auto text-xs">
          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
            <div className="p-4 border-b border-slate-800 font-bold text-white text-sm">
              Batches & FEFO Traceability ({batches.length} Batches)
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left">
                <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                  <tr>
                    <th className="p-3">Batch #</th>
                    <th className="p-3">Medicine</th>
                    <th className="p-3">Expiry</th>
                    <th className="p-3">Status</th>
                    <th className="p-3">Stock</th>
                    <th className="p-3">Selling Price</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {batches.map(b => (
                    <tr key={b.id} className="hover:bg-slate-800/50">
                      <td className="p-3 font-mono font-bold text-white">{b.batch_number}</td>
                      <td className="p-3 text-slate-200">{b.medicine_name}</td>
                      <td className="p-3 font-mono">{b.expiry_date}</td>
                      <td className="p-3">
                        <span className={px-2 py-0.5 rounded text-[10px] font-bold }>
                          {b.expiry_status}
                        </span>
                      </td>
                      <td className="p-3 font-mono font-bold text-cyan-400">{b.quantity}</td>
                      <td className="p-3 font-mono text-white">₹{b.selling_price}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function ExpiryComponent({ alerts }) {
      const exp = alerts?.expiry_monitor || { expired_batches: [], critical_batches: [], warning_batches: [] };
      const low = alerts?.low_stock?.items || [];

      return (
        <div className="space-y-6 max-w-6xl mx-auto text-xs">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-slate-900 border border-orange-900/50 p-4 rounded-xl space-y-2">
              <span className="font-bold text-orange-400 text-sm">Critical (&le; 7 Days): {exp.critical_batches?.length || 0}</span>
              <div className="space-y-1.5 max-h-48 overflow-y-auto">
                {exp.critical_batches?.map(b => (
                  <div key={b.id} className="p-2 bg-slate-950 rounded flex justify-between">
                    <div><p className="text-white font-bold">{b.medicine_name}</p><span className="text-[10px] text-slate-400">{b.batch_number}</span></div>
                    <span className="text-orange-400 font-mono font-bold">{b.days_left}d left</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-slate-900 border border-amber-900/50 p-4 rounded-xl space-y-2">
              <span className="font-bold text-amber-400 text-sm">Warning (8-30 Days): {exp.warning_batches?.length || 0}</span>
              <div className="space-y-1.5 max-h-48 overflow-y-auto">
                {exp.warning_batches?.map(b => (
                  <div key={b.id} className="p-2 bg-slate-950 rounded flex justify-between">
                    <div><p className="text-white font-bold">{b.medicine_name}</p><span className="text-[10px] text-slate-400">{b.batch_number}</span></div>
                    <span className="text-amber-400 font-mono font-bold">{b.days_left}d left</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-slate-900 border border-rose-900/50 p-4 rounded-xl space-y-2">
              <span className="font-bold text-rose-400 text-sm">Expired (Quarantine): {exp.expired_batches?.length || 0}</span>
              <div className="space-y-1.5 max-h-48 overflow-y-auto">
                {exp.expired_batches?.map(b => (
                  <div key={b.id} className="p-2 bg-slate-950 rounded flex justify-between">
                    <div><p className="text-white font-bold">{b.medicine_name}</p><span className="text-[10px] text-slate-400">{b.batch_number}</span></div>
                    <span className="text-rose-400 font-mono font-bold">Expired</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
            <h4 className="font-bold text-white text-sm mb-3">Low Stock Threshold Warnings</h4>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              {low.map(item => (
                <div key={item.id} className="p-3 bg-slate-950 rounded flex justify-between items-center border border-slate-800">
                  <div><p className="font-bold text-white">{item.name}</p><span className="text-[10px] text-slate-500">Reorder at: {item.reorder_level}</span></div>
                  <span className="font-mono font-bold text-rose-400">{item.current_stock} left</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function PurchasesComponent({ purchases }) {
      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden max-w-6xl mx-auto text-xs">
          <div className="p-4 border-b border-slate-800 font-bold text-white text-sm">Purchase Orders</div>
          <table className="w-full text-left">
            <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
              <tr><th className="p-3">PO #</th><th className="p-3">Supplier</th><th className="p-3">Status</th><th className="p-3">Amount</th></tr>
            </thead>
            <tbody className="divide-y divide-slate-800">
              {purchases.map(p => (
                <tr key={p.id}>
                  <td className="p-3 font-mono font-bold text-white">{p.po_number}</td>
                  <td className="p-3 text-slate-200">{p.supplier_name}</td>
                  <td className="p-3"><span className="px-2 py-0.5 rounded text-[10px] bg-blue-500/20 text-blue-400">{p.status}</span></td>
                  <td className="p-3 font-mono text-white">₹{p.total_amount}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function PrescriptionsComponent({ prescriptions, onDone, notify, currentRole }) {
      const act = async (id, action) => {
        const res = await fetch(${API_BASE}/prescriptions//verify/, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action })
        });
        if (res.ok) { notify(Prescription !); onDone(); }
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-6xl mx-auto text-xs">
          {prescriptions.map(rx => (
            <div key={rx.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
              <div className="flex justify-between font-bold">
                <span className="text-white font-mono">{rx.prescription_number}</span>
                <span className={px-2 py-0.5 rounded text-[10px] }>{rx.status}</span>
              </div>
              <p className="text-slate-400">Doctor: <span className="text-white">{rx.doctor_name}</span> | Patient: <span className="text-white">{rx.customer_name}</span></p>
              <div className="bg-slate-950 p-2.5 rounded text-slate-300">{rx.notes || 'Routine prescription'}</div>
              {['ADMIN', 'PHARMACIST'].includes(currentRole) && rx.status === 'PENDING' && (
                <div className="flex gap-2">
                  <button onClick={() => act(rx.id, 'APPROVE')} className="flex-1 py-1.5 bg-emerald-600 text-white font-bold rounded">Approve</button>
                  <button onClick={() => act(rx.id, 'REJECT')} className="px-3 py-1.5 bg-rose-600 text-white font-bold rounded">Reject</button>
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    function CustomersComponent({ customers }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-6xl mx-auto text-xs">
          {customers.map(c => (
            <div key={c.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
              <div>
                <h4 className="font-bold text-white text-sm">{c.name}</h4>
                <p className="text-slate-400 font-mono mt-0.5">{c.phone}</p>
                <p className="text-slate-500 text-[11px] mt-1">{c.address || 'Registered Profile'}</p>
              </div>
              <div className="text-right">
                <span className="text-slate-400">Total Spend</span>
                <p className="text-emerald-400 font-mono font-bold text-sm">₹{c.total_spend || 0}</p>
              </div>
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
